<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380" fill="none">
  <!-- St Mary's Catholic Primary School Themed Wallpaper Tile -->
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Corner 1: Marian Star of Wisdom -->
  <g transform="translate(45, 45)">
    <!-- Outer accent ring -->
    <circle cx="0" cy="0" r="28" stroke="#4169E1" stroke-width="1" stroke-dasharray="3,3" opacity="0.45"/>
    <circle cx="0" cy="0" r="14" fill="url(#starGlow)" opacity="0.6"/>
    <!-- 8-Point Star -->
    <path d="M0 -22 L4 -6 L20 -6 L7 3 L12 19 L0 9 L-12 19 L-7 3 L-20 -6 L-4 -6 Z" fill="#4169E1" fill-opacity="0.25" stroke="#2563EB" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="3.5" fill="#D97706"/>
  </g>

  <!-- Center: Official St Mary's Catholic Crest Shield -->
  <g transform="translate(190, 190)">
    <!-- Outer halo rays -->
    <circle cx="0" cy="0" r="62" stroke="#4169E1" stroke-width="0.75" stroke-dasharray="2,4" opacity="0.35"/>
    
    <!-- Shield Container -->
    <path d="M-44 -52 L44 -52 Q44 14 0 58 Q-44 14 -44 -52 Z" fill="#FFFFFF" fill-opacity="0.4" stroke="#1D4ED8" stroke-width="2.2"/>
    <path d="M-38 -46 L38 -46 Q38 10 0 50 Q-38 10 -38 -46 Z" stroke="#D97706" stroke-width="1.2" stroke-dasharray="4,2" opacity="0.75"/>

    <!-- Christian Cross inside Shield -->
    <path d="M0 -38 L0 18 M-18 -18 L18 -18" stroke="#1E40AF" stroke-width="2.8" stroke-linecap="round"/>
    
    <!-- Open Book of Knowledge -->
    <path d="M-22 14 Q-11 9 0 14 Q11 9 22 14 L22 30 Q11 25 0 30 Q-11 25 -22 30 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <line x1="0" y1="14" x2="0" y2="30" stroke="#D97706" stroke-width="1.5"/>

    <!-- School Motto Banner Ribbon -->
    <path d="M-36 40 Q0 48 36 40 L34 46 Q0 54 -34 46 Z" fill="#1D4ED8" fill-opacity="0.7"/>
  </g>

  <!-- Corner 2: Open Holy Bible / Educational Scripture -->
  <g transform="translate(335, 45)">
    <circle cx="0" cy="0" r="24" stroke="#D97706" stroke-width="1" stroke-dasharray="2,3" opacity="0.4"/>
    <path d="M-20 -10 Q-10 -15 0 -10 Q10 -15 20 -10 L20 10 Q10 5 0 10 Q-10 5 -20 10 Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#2563EB" stroke-width="1.6"/>
    <!-- Small bookmark cross -->
    <path d="M0 -14 L0 -10" stroke="#D97706" stroke-width="2"/>
  </g>

  <!-- Corner 3: Laurel Wreath of Botho & Moral Excellence -->
  <g transform="translate(45, 335)">
    <circle cx="0" cy="0" r="26" stroke="#4169E1" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>
    <!-- Laurel curves -->
    <path d="M-18 12 C-24 0 -16 -16 0 -22 C16 -16 24 0 18 12" stroke="#1D4ED8" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M-16 4 Q-22 2 -20 -3 Q-14 -1 -16 4 Z" fill="#2563EB" fill-opacity="0.3" stroke="#2563EB" stroke-width="0.8"/>
    <path d="M16 4 Q22 2 20 -3 Q14 -1 16 4 Z" fill="#2563EB" fill-opacity="0.3" stroke="#2563EB" stroke-width="0.8"/>
    <path d="M-10 -12 Q-14 -18 -8 -20 Q-6 -14 -10 -12 Z" fill="#2563EB" fill-opacity="0.3" stroke="#2563EB" stroke-width="0.8"/>
    <path d="M10 -12 Q14 -18 8 -20 Q6 -14 10 -12 Z" fill="#2563EB" fill-opacity="0.3" stroke="#2563EB" stroke-width="0.8"/>
    <!-- Center star -->
    <circle cx="0" cy="-22" r="3.5" fill="#D97706"/>
  </g>

  <!-- Corner 4: Christian Celtic Cross Emblem -->
  <g transform="translate(335, 335)">
    <circle cx="0" cy="0" r="16" stroke="#D97706" stroke-width="1.4" opacity="0.6"/>
    <path d="M0 -22 L0 22 M-16 -4 L16 -4" stroke="#1E40AF" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="0" cy="-4" r="3" fill="#D97706"/>
  </g>

  <!-- Diagonal Elegant Connecting Geometric Diamond Links -->
  <g stroke="#2563EB" stroke-width="0.75" stroke-dasharray="4,6" opacity="0.35">
    <line x1="45" y1="45" x2="190" y2="190"/>
    <line x1="335" y1="45" x2="190" y2="190"/>
    <line x1="45" y1="335" x2="190" y2="190"/>
    <line x1="335" y1="335" x2="190" y2="190"/>
  </g>

  <!-- Small Midpoint Virtues Nodes -->
  <circle cx="190" cy="45" r="3.5" fill="#D97706" opacity="0.6"/>
  <circle cx="190" cy="335" r="3.5" fill="#D97706" opacity="0.6"/>
  <circle cx="45" cy="190" r="3.5" fill="#2563EB" opacity="0.6"/>
  <circle cx="335" cy="190" r="3.5" fill="#2563EB" opacity="0.6"/>
</svg>

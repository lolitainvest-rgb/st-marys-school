<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" fill="none">
  <!-- Subtle repeating background tile for St Mary's Catholic Primary School -->
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4169E1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Corner 1: Marian Star / Star of Excellence -->
  <g transform="translate(40, 40)" stroke="#4169E1" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M0 -18 L4 -5 L18 0 L4 5 L0 18 L-4 5 L-18 0 L-4 -5 Z"/>
    <circle cx="0" cy="0" r="3" fill="#FFD700" fill-opacity="0.8"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke-dasharray="2,3" stroke-width="0.8"/>
    <line x1="0" y1="-22" x2="0" y2="22" stroke-dasharray="2,3" stroke-width="0.8"/>
  </g>

  <!-- Center: St Mary's Catholic Shield Crest with Cross & Book -->
  <g transform="translate(180, 180)" stroke="#1e3a8a" stroke-width="1.5" fill="none">
    <!-- Shield Outline -->
    <path d="M-36 -42 L36 -42 Q36 6 0 46 Q-36 6 -36 -42 Z" stroke-width="1.6"/>
    <path d="M-30 -36 L30 -36 Q30 4 0 38 Q-30 4 -30 -36 Z" stroke-width="0.8" stroke-dasharray="3,2"/>
    
    <!-- Christian Cross inside Shield -->
    <path d="M0 -30 L0 16 M-14 -16 L14 -16" stroke="#4169E1" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Open Book of Wisdom -->
    <path d="M-18 10 Q-9 6 0 10 Q9 6 18 10 L18 24 Q9 20 0 24 Q-9 20 -18 24 Z" stroke="#FFD700" stroke-width="1.2" fill="#FFD700" fill-opacity="0.1"/>
    <line x1="0" y1="10" x2="0" y2="24" stroke="#FFD700" stroke-width="1.2"/>
    
    <!-- Rays of Light -->
    <line x1="0" y1="-48" x2="0" y2="-44" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="28" y1="-48" x2="24" y2="-44" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="-28" y1="-48" x2="-24" y2="-44" stroke="#FFD700" stroke-width="1.5"/>
  </g>

  <!-- Corner 2: Open Book of Knowledge -->
  <g transform="translate(320, 40)" stroke="#4169E1" stroke-width="1.2" fill="none" opacity="0.75">
    <path d="M-16 -8 Q-8 -12 0 -8 Q8 -12 16 -8 L16 8 Q8 4 0 8 Q-8 4 -16 8 Z"/>
    <line x1="0" y1="-8" x2="0" y2="8"/>
    <circle cx="0" cy="-14" r="2.5" fill="#FFD700"/>
  </g>

  <!-- Corner 3: Laurel of Excellence & Virtue (Botho) -->
  <g transform="translate(40, 320)" stroke="#4169E1" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M-14 10 C-18 0 -12 -12 0 -16 C12 -12 18 0 14 10" stroke-linecap="round"/>
    <!-- Small Leaves -->
    <path d="M-13 4 Q-19 2 -17 -2 Q-12 0 -13 4 Z" fill="#4169E1" fill-opacity="0.2"/>
    <path d="M13 4 Q19 2 17 -2 Q12 0 13 4 Z" fill="#4169E1" fill-opacity="0.2"/>
    <circle cx="0" cy="-16" r="3" fill="#FFD700"/>
  </g>

  <!-- Corner 4: Christian Cross & Dove of Peace Motif -->
  <g transform="translate(320, 320)" stroke="#1e3a8a" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M0 -16 L0 16 M-10 -6 L10 -6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="16" stroke-dasharray="2,3" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="2" fill="#FFD700"/>
  </g>

  <!-- Subtle connecting lattice lines -->
  <path d="M40 40 L180 180 L320 40 M40 320 L180 180 L320 320" stroke="#4169E1" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.35"/>
  <circle cx="180" cy="40" r="2" fill="#FFD700" opacity="0.5"/>
  <circle cx="180" cy="320" r="2" fill="#FFD700" opacity="0.5"/>
  <circle cx="40" cy="180" r="2" fill="#FFD700" opacity="0.5"/>
  <circle cx="320" cy="180" r="2" fill="#FFD700" opacity="0.5"/>
</svg>
